version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/p2p.db
      - Jwt__Key=P2P-Secret-Key-Min-32-Chars-For-Production-2024!
      - Jwt__Issuer=P2PApp
      - Jwt__Audience=P2PUsers
      - AllowedOrigins=http://localhost:4200
    volumes:
      - ./data:/app/data
    networks:
      - p2p-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - p2p-network

networks:
  p2p-network:
    driver: bridge
