name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: 'p2p-procurement-api'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore backend/P2P.sln

      - name: Build
        run: dotnet build backend/P2P.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/P2P.sln --no-build --configuration Release --verbosity normal

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: dotnet publish backend/P2P.API/P2P.API.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
